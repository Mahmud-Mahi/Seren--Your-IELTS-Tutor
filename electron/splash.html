<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Starting Seren…</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #282a36;
        color: #f8f8f2;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        -webkit-app-region: drag;
        user-select: none;
      }
      .ring {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid #44475a;
        border-top-color: #8be9fd;
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0;
        padding: 0 28px;
        font-size: 12.5px;
        line-height: 1.5;
        text-align: center;
        color: #9aa0b5;
      }
    </style>
  </head>
  <body>
    <div class="ring"></div>
    <h1>Starting Seren…</h1>
    <p>Warming up your IELTS tutor. The very first launch can take a few seconds.</p>
  </body>
</html>
